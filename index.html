<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SUM 保修戰情室｜登入</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 72% 10%,#48141a 0,transparent 37%),#09090a;color:#f7f3f0;font:15px/1.65 Inter,"Noto Sans TC",system-ui,sans-serif}.card{width:min(440px,calc(100% - 32px));padding:38px;border:1px solid #4b2529;border-radius:20px;background:linear-gradient(145deg,#211012,#111113);box-shadow:0 30px 90px #0009}.brand{display:flex;align-items:center;gap:10px}.logo{padding:11px 9px;border-radius:8px;background:#d71920;font:900 20px/1 Arial}.tag{color:#c6a7a8;font-size:11px;letter-spacing:.12em}h1{margin:26px 0 6px;font-size:30px}p{margin:0 0 24px;color:#a69d9a}label{display:block;margin:15px 0 6px;color:#ddd3cf;font-size:13px}input{width:100%;padding:13px 14px;border:1px solid #493034;border-radius:9px;background:#0e0d0f;color:#fff;font:inherit;outline:none}input:focus{border-color:#d71920;box-shadow:0 0 0 3px #d7192028}button{width:100%;margin-top:22px;padding:13px;border:0;border-radius:9px;background:#d71920;color:#fff;font:800 15px/1.2 inherit;cursor:pointer}button:disabled{opacity:.55}.msg{min-height:23px;margin-top:13px;color:#ff8d90;font-size:13px}.portal{display:none}.portal h2{margin:24px 0 8px}.meta{padding:14px;border:1px solid #3d2d30;border-radius:10px;background:#161315;color:#bdb2ae}.logout{background:#2d292a}@media(max-width:520px){.card{padding:28px}h1{font-size:26px}}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand"><span class="logo">SUM</span><span class="tag">WAR ROOM · SECURE ACCESS</span></div>
    <section id="login">
      <h1>登入戰情室</h1>
      <p>依帳號權限顯示可管理的區域與店家。</p>
      <form id="form">
        <label for="email">帳號</label><input id="email" name="email" type="email" autocomplete="username" required>
        <label for="password">密碼</label><input id="password" name="password" type="password" autocomplete="current-password" required>
        <button id="submit" type="submit">登入</button>
        <div class="msg" id="msg" role="alert"></div>
      </form>
    </section>
    <section class="portal" id="portal">
      <h2>登入成功</h2>
      <p>帳號與權限後端已啟用。</p>
      <div class="meta" id="meta"></div>
      <button id="manage" style="display:none">帳號與權限</button>
      <button class="logout" id="logout">登出</button>
    </section>
    <section class="portal" id="users">
      <h2>帳號與權限</h2>
      <p>以 Email 建立帳號，並隨時啟用或停用。</p>
      <form id="userForm">
        <label for="newEmail">使用者 Email</label><input id="newEmail" type="email" required>
        <label for="newPassword">初始密碼</label><input id="newPassword" type="password" minlength="8" required>
        <label for="newRole">角色</label>
        <select id="newRole" style="width:100%;padding:13px;border:1px solid #493034;border-radius:9px;background:#0e0d0f;color:white">
          <option value="viewer">僅檢視</option><option value="store_user">店家帳號</option><option value="regional_manager">區域管理者</option><option value="headquarters">總部管理者</option><option value="system_admin">系統管理員</option>
        </select>
        <button type="submit">新增並寄出通知</button>
      </form>
      <div id="userMsg" class="msg"></div><div id="userList"></div>
      <button class="logout" id="back">返回</button>
    </section>
  </main>
  <script>
    const login = document.querySelector("#login"), portal = document.querySelector("#portal"), msg = document.querySelector("#msg");
    let me=null;
    function showUser(user){me=user;login.style.display="none";portal.style.display="block";document.querySelector("#meta").textContent=`${user.display_name||user.displayName||""}｜${user.email}｜${user.role}`;document.querySelector("#manage").style.display=user.role==="system_admin"?"block":"none";}
    async function check(){const r=await fetch("/api/auth/me");if(r.ok)showUser((await r.json()).user);}
    document.querySelector("#form").addEventListener("submit",async e=>{e.preventDefault();const btn=document.querySelector("#submit");btn.disabled=true;msg.textContent="";try{const r=await fetch("/api/auth/login",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({email:e.target.email.value,password:e.target.password.value})});const data=await r.json();if(!r.ok)throw new Error(data.error||"登入失敗");showUser(data.user);}catch(err){msg.textContent=err.message;}finally{btn.disabled=false;}});
    document.querySelector("#logout").addEventListener("click",async()=>{await fetch("/api/auth/logout",{method:"POST"});location.reload();});
    async function loadUsers(){const r=await fetch("/api/admin/users"),data=await r.json();if(!r.ok)return;document.querySelector("#userList").innerHTML=data.users.map(u=>`<div class="meta" style="margin-top:10px">${u.email}<br><small>${u.role}｜${u.is_active?"已啟用":"已停用"}</small>${Number(u.id)!==Number(me.id)?`<button data-id="${u.id}" data-active="${!u.is_active}" style="margin-top:9px">${u.is_active?"停用權限":"重新啟用"}</button>`:""}</div>`).join("");document.querySelectorAll("#userList button").forEach(b=>b.onclick=async()=>{await fetch("/api/admin/users",{method:"PATCH",headers:{"content-type":"application/json"},body:JSON.stringify({id:Number(b.dataset.id),isActive:b.dataset.active==="true"})});loadUsers();});}
    document.querySelector("#manage").onclick=()=>{portal.style.display="none";document.querySelector("#users").style.display="block";loadUsers();};
    document.querySelector("#back").onclick=()=>{document.querySelector("#users").style.display="none";portal.style.display="block";};
    document.querySelector("#userForm").addEventListener("submit",async e=>{e.preventDefault();const r=await fetch("/api/admin/users",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({email:document.querySelector("#newEmail").value,password:document.querySelector("#newPassword").value,role:document.querySelector("#newRole").value})}),data=await r.json();const m=document.querySelector("#userMsg");m.textContent=r.ok?(data.email.sent?"帳號已建立，通知信已寄出":"帳號已建立；寄信服務尚未設定"):data.error;if(r.ok){e.target.reset();loadUsers();}});
    check();
  </script>
</body>
</html>
