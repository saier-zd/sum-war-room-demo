<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SUM 保修戰情室</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 70% 10%,#401318 0,transparent 36%),#0b0b0c;color:#f7f3f0;font:15px/1.7 Inter,"Noto Sans TC",system-ui,sans-serif}.card{width:min(720px,calc(100% - 32px));padding:42px;border:1px solid #4a262a;border-radius:20px;background:linear-gradient(140deg,#211012,#121214);box-shadow:0 30px 80px #0008}.logo{display:inline-block;padding:11px 9px;border-radius:8px;background:#d71920;font:900 20px/1 Arial}.tag{margin-left:9px;color:#c6a7a8;font-size:11px;letter-spacing:.12em}h1{font-size:32px;margin:24px 0 8px}p{color:#aaa19d;margin:0}.features{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:25px 0}.feature{padding:14px;border:1px solid #39282a;border-radius:10px;background:#171416}.feature b{display:block;color:#ef6a6e}.feature span{font-size:12px;color:#8e8582}a{display:inline-block;margin-top:5px;padding:12px 18px;border-radius:9px;background:#d71920;color:white;text-decoration:none;font-weight:800}@media(max-width:600px){.card{padding:27px}.features{grid-template-columns:1fr}h1{font-size:26px}}
  </style>
</head>
<body>
  <main class="card">
    <span class="logo">SUM</span><span class="tag">WAR ROOM · PRIVATE DATA</span>
    <h1>SUM 保修戰情室已更新</h1>
    <p>GitHub 保存介面與歷史版本；營收、工單、店家與會員資料不公開上傳。完整戰情內容請從具權限的 Sites 網站查看。</p>
    <div class="features"><div class="feature"><b>總部版</b><span>全體與區域戰力</span></div><div class="feature"><b>各區版</b><span>轄區店家比較</span></div><div class="feature"><b>店家版</b><span>單店營運追蹤</span></div></div>
    <a href="https://sum-repair-dashboard.saierzd.chatgpt.site">開啟權限網站</a>
  </main>
</body>
</html>
